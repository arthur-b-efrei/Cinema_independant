<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — Assistant cinéma indépendant</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <p>Assistant pour un cinéma indépendant</p>
  </header>
  <main>
    <h1>Cap Web</h1>
    <p>Votre assistant pour découvrir les films et les séances d'un cinéma indépendant.</p>

    <section aria-label="Conversation">
      <ul id="messages" aria-label="Messages de la conversation"></ul>

      <form id="chat-form">
        <label for="message">Votre message (250 caractères maximum)</label>
        <textarea id="message" name="message" maxlength="250"></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </section>

    <section class="questions" aria-label="Questions suggérées">
      <button type="button" data-question="Quels films sont disponibles ?">Films disponibles</button>
      <button type="button" data-question="Quels sont les horaires ?">Horaires</button>
      <button type="button" data-question="Peux-tu résumer un film ?">Résumé d'un film</button>
    </section>

    <button type="button" id="effacer">Effacer la conversation</button>

    <p id="status" role="status"></p>
  </main>
  <footer>
    <p>Cap Web · J1 Appareillage</p>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
