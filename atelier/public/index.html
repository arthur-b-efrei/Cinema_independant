<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — Assistant cinéma indépendant</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <p>Votre assistant pour découvrir les films et les séances d'un cinéma indépendant.</p>

    <ul id="messages" aria-label="Messages de la conversation"></ul>

    <form id="chat-form">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" maxlength="300"></textarea>
      <button type="submit">Envoyer</button>
    </form>

    <p id="status" role="status"></p>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
